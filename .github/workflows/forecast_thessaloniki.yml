name: Thessaloniki Fuel Price Forecast Engine

on:
  schedule:
    # 08:00 UTC (11:00 EET): Daily morning forecast for Thessaloniki
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Live Thessaloniki Forecast
        run: |
          chmod +x fuelcast
          # Generate live regional forecast for Thessaloniki
          ./fuelcast forecast --region thessaloniki --live --horizon 3
          # Print database state
          ./fuelcast db-status

      - name: Commit & Push Updated Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fuelcast.db
          git diff --staged --quiet || (git commit -m "chore(data): automated daily Thessaloniki forecast [skip ci]" && git push)
