name: Daily FuelCast Ingestion & Forecast Engine

on:
  schedule:
    # 07:45 UTC (10:45 EET): Morning Ministry of Development & station price sync
    - cron: '45 7 * * 1-5'
    # 21:45 UTC: European & NYMEX Brent crude / FX daily close
    - cron: '45 21 * * 1-5'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Live Ingestion & Forecasting
        run: |
          chmod +x fuelcast
          # 1. Ingest upstream Brent Crude and EUR/USD FX rates
          ./fuelcast ingest-upstream --days 30
          # 2. Ingest live ground-truth retail pump stations
          ./fuelcast ingest-domestic --live --region kalamaria --radius 10
          ./fuelcast ingest-domestic --live --region thessaloniki --radius 15
          ./fuelcast ingest-domestic --live --region athens --radius 20
          # 3. Generate regional forecasts and persist signals
          ./fuelcast forecast --horizon 3
          # 4. Print database state
          ./fuelcast db-status

      - name: Commit & Push Updated Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fuelcast.db
          git diff --staged --quiet || (git commit -m "chore(data): automated daily fuel market ingestion [skip ci]" && git push)
