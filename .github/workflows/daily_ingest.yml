name: Daily FuelCast Ingestion & Forecast Engine

on:
  schedule:
    # 07:45 UTC (10:45 Greek local time): Captures morning Ministry/station price submissions
    - cron: '45 7 * * 1-5'
    # 21:45 UTC: Captures European & NYMEX Brent crude / FX daily close
    - cron: '45 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Upstream & Domestic Ingestion
        run: |
          chmod +x fuelcast
          # 1. Pull global market quotes (Brent crude + EUR/USD)
          ./fuelcast ingest-upstream --days 30
          # 2. Pull live domestic station pricing for key Greek urban centers
          ./fuelcast ingest-domestic --live --region kalamaria --radius 10
          ./fuelcast ingest-domestic --live --region thessaloniki --radius 15
          ./fuelcast ingest-domestic --live --region athens --radius 20
          # 3. Generate and persist forecasts
          ./fuelcast forecast --horizon 3
          # 4. Display database metrics
          ./fuelcast db-status

      - name: Commit & Persist Database
        run: |
          git config user.name "FuelCast Bot"
          git config user.email "bot@fuelcast.gr"
          git add data/fuelcast.db
          git diff --staged --quiet || git commit -m "chore(data): automated daily fuel market ingestion [skip ci]"
          git push
